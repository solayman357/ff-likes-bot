# Nginx Reverse Proxy for FF Likes API
# Install: sudo cp nginx-ff-likes-api.conf /etc/nginx/sites-available/ff-likes-api
# Then: sudo ln -s /etc/nginx/sites-available/ff-likes-api /etc/nginx/sites-enabled/
# Then: sudo certbot --nginx -d your-api-domain.com
# Then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name your-api-domain.com;
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name your-api-domain.com;

    ssl_certificate /etc/letsencrypt/live/your-api-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-api-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
