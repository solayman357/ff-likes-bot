name: Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render API deploy
        run: |
          curl -X POST ${{ secrets.RENDER_API_URL }} \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'

  deploy-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Bot deploy
        run: |
          curl -X POST ${{ secrets.RENDER_BOT_URL }} \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'